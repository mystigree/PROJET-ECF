<div class="pagesignin">
  <div class="comments row justify-content-center">
    <article class="MessageSignin col-8">
      <p class="BeforeSignin">Si vous avez déjà crée un compte, veuillez vous connecter à votre compte en remplissant les informations ci-dessous.</p>
    </article>
  </div>

  <form>
      <div class="signin row justify-content-center">
          <article class="content col-8">
              <div class="mb-3">
                  <label for="EmailInput">Adresse e.mail:</label>
                  <input type="email" class="w-100" id="EmailInput" placeholder="adresse@adresseemail.com">
              </div>
          </article>

          <article class="content col-8">
              <div class="mb-3">
                  <label for="PasswordInput">Mot de passe:</label>
                  <input type="password" class="w-100" id="PasswordInput" placeholder="password1234">
              </div>
          </article>
      </div>

      <div class="d-flex flex-row justify-content-center">
          <button class="button button-signin col-8" type="submit">Se connecter</button>
      </div>
      
  </form>

  <div class="comments row justify-content-center">
    <article class="MessageSignin col-8">
      <p class="AfterSignin col-8">Si vous n'avez pas encore crée de compte, veuillez vous inscrire sur le site en cliquant sur le lien ci dessous : <a href="/signup" class="signup">s'inscrire</a>.</p>
    </article>
  </div>
</div>
