<div class="pagecontact">
  <div class="comments row justify-content-center">
    <article class="MessageMessage col-8">
      <p class="BeforeMessage">Pour toutes questions ou demande, veuillez saisir vos informations dans les champs ci-dessous. Vôtre demande sera traité le plus rapidement possible.</p>
    </article>
  </div>

  <form>
      <div class="connexion row justify-content-center">
          <article class="content col-8">
              <div class="mb-3">
                  <label for="EmailInput">Adresse e.mail:</label>
                  <input type="email" class="w-100" id="EmailInput" placeholder="adresse@adresseemail.com">
              </div>
          </article>

          <article class="content col-8">
              <div class="mb-3">
                  <label for="PseudoInput">Pseudo:</label>
                  <input type="text" class="w-100" id="PseudoInput" placeholder="Pseudo">
              </div>
          </article>

          <article class="content col-8">
              <div class="mb-3">
                  <label for="MessageInput">Détails de la demande (questions, remarques ...) :</label>
                  <textarea class="MassageInput w-100" id="Message" placeholder="Bonjours, j'aimerais vous joindre car ..." required></textarea>
              </div>
          </article>
      </div>

      <div class="d-flex flex-row justify-content-center">
          <button class="button button-message col-8" type="submit">Envoyer</button>
      </div>
      
  </form>
</div>
