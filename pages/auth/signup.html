<div class="pagesignup">
  <div class="comments row justify-content-center">
    <article class="MessageSignup col-8">
      <p class="BeforeSignup">Si vous n'avez pas de compte, inscrivez vous sur notre site en complétant le formulaire ci-dessous.</p>
    </article>
  </div>

  <form>
      <div class="signup row justify-content-center">
          <article class="content col-8">
              <div class="mb-3">
                  <label for="EmailInput">Adresse e.mail:</label>
                  <input type="email" class="w-100" id="EmailInput" placeholder="adresse@adresseemail.com">
              </div>
          </article>

          <article class="content col-8">
              <div class="mb-3">
                  <label for="PseudoInput">Pseudo:</label>
                  <input type="text" class="w-100" id="PseudoInput" placeholder="Pseudo">
              </div>
          </article>

          <article class="content col-8">
              <div class="mb-3">
                  <label for="PasswordInput">Mot de passe:</label>
                  <input type="password" class="w-100" id="PasswordInput" placeholder="password1234">
              </div>
          </article>

          <article class="content col-8">
              <div class="mb-3">
                  <label for="PasswordConfirmationInput">Confirmer le mot de passe:</label>
                  <input type="password" class="w-100" id="PasswordConfirmationInput" placeholder="password1234">
              </div>
          </article>
      </div>

      <div class="d-flex flex-row justify-content-center">
          <button class="button button-signup col-8" type="submit">S'inscrire</button>
      </div>
      
  </form>

  <div class="comments row justify-content-center">
    <article class="MessageSignup col-8">
      <p class="AfterSignup col-8">Si vous avez déjà crée un compte, veuillez vous connecter à votre compte en cliquant sur le lien ci dessous : <a href="/signin" class="signin">se connecter</a>.</p>
    </article>
  </div>
</div>
