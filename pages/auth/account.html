<div class="pageaccount">
  <div class="comments row justify-content-center">
    <article class="MessageAccount col-8">
      <p>Voici votre espace contenant les informations concernant votre compte ou vous pouvez modifier ou supprimer votre informations.</p>
    </article>
  </div>

  <form>
      <div class="account row justify-content-center">
          <article class="content col-8">
              <div class="mb-3">
                  <label for="inputMail">Adresse e.mail:</label>
                  <input type="email" class="w-100" id="inputMail" placeholder="adresse@adresseemail.com" value="adresse@adresseemail.com">
              </div>
          </article>

          <article class="content col-8">
              <div class="mb-3">
                  <label for="inputPseudo">Pseudo:</label>
                  <input type="text" class="w-100" id="inputPseudo" placeholder="Pseudo" value="Pseudo">
              </div>
          </article>
      </div>

      <div class="d-flex flex-lg-row flex-column justify-content-lg-center align-items-center">
          <button class="button-modify col-8 mx-lg-5 my-lg-5 my-3" type="submit">Modifier vos informations</button>
          <button class="button-delete col-8 mx-lg-5 my-lg-5 mt-3 mb-5" type="submit">Supprimer mon compte</button>
      </div>
      
  </form>

  <div class="MessageEditPassword row justify-content-center">
    <a class="col-8 text-center" href="/editPassword">Cliquez ici pour modifier votre mot de passe</a>
  </div>
</div>
