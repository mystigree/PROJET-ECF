<!DOCTYPE html>

<!-- Déclaration de la balise html pour la page d'accueil du site-->
<html>

<!-- Déclaration de la balise head -->
<head>
    <!--Ajouter un titre à l'onglet du site-->
    <title>PixelVerse Studio</title>
    <!--Lier nôte document HTML à la notre feuille de style CSS-->
    <link rel="stylesheet" href="contact.css">
</head>

<!-- Déclaration de la balise body -->
<body>

    <!-- Ajouter l'en-tête du site -->
    <header>
        <!-- Insérer l'image du logo du site-->
        <img src="../images/Logo PixelVerse Studio.png" alt="Logo PixelVerse Studio">
    </header>

    <!-- Déclarer la barre de menu du site -->
    <nav>

        <!-- Insérer un compte -->
        <section class = "compte">
            <!-- Créer le cercle du compte et insérer les initials du compte-->
            <div class="cercle-compte">
                <p class="initials">P</p>
            </div>
            <!-- Insérer le pseudo du compte-->
            <div class="pseudo">
                <p>Pseudo</p>
            </div>
        </section>

        <!-- Insérer tous les liens de la barre de menu avec leur icône et leur texte -->
        <ul>
            <li><a class="accueil" href="../ACCUEIL/accueil.html"> <img src="../images/Icône Accueil.png" alt="Icône Accueil">Accueil</a></li>
            <li><a class="se_connecter" href="../SE_CONNECTER/se_connecter.html"><img src="../images/Icône Se Connecter.png" alt="Icône Se Connecter">Se Connecter</a></li>
            <li><a class="creations" href="../CREATIONS/creations.html"><img src="../images/Icône Créations.png" alt="Icône Créations">Créations</a></li>
            <li><a class="contact" href="../CONTACT/contact.html"><img src="../images/Icône Contact.png" alt="Icône Contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Ajouter le contenu principal du site -->
     <main>

        <!-- Créer une section qui a pour classe "Paragraphe" -->
        <section class="Paragraphe">
            <!-- Insérer un paragraphe qui décrit comment communiquer pour poser des quesyions ou demander plus d'informations au niveau du site -->
            <p>Pour toutes questions ou demande, veuillez saisir vos informations dans les champs ci-dessous. Vôtre demande sera traité le plus rapidement possible.</p>
        </section>

        <!-- Créer une autre section qui a pour classe "informations" -->
        <section class="informations">

            <!-- Créer un formulaire pour recueillir les informations des utilisateurs -->
            <form action="#" method="POST">

                <!-- Créer une div qui a pour classe "adresseemail"-->
                <div class="adresseemail">
                    <!-- Créer un champ pour l'adresse e-mail de l'utilisateur -->
                    <label class="labelemail" for="email">E-mail :</label>
                    <input class="inputemail" type="email" id="email" name="email" placeholder="pseudo@gmail.com" required>
                </div>
                        
                <!-- Créer une div qui a pour classe "titlepseudo"-->
                <div class="titlepseudo">
                    <!-- Créer un champ pour le pseudo de l'utilisateur -->
                    <label class="labelpseudo" for="nom">Pseudo :</label>
                    <input class="inputpseudo" type="text" id="nom" name="nom" placeholder="Pseudo" required>
                </div>
                        
                <!-- Créer une div qui a pour classe "message"-->
                <div class="message">
                    <!-- Créer un champ pour le message de l'utilisateur -->
                     <label class="labelmessage" for="message">Détails de la demande (questions, remarques ...) :</label>
                    <textarea class="inputmessage" id="message" name="message" placeholder="Bonjours, j'aimerais savoir si il serait possible de ..." required></textarea>
                </div>
                        
                <!-- Créer une div qui a pour classe "envoyer"-->
                <div class="envoyer">
                    <!-- Créer un bouton pour soumettre le formulaire -->
                    <button type="submit">Envoyer</button>
                </div>

            </form>

        </section>

     </main>

     <!-- Ajouter le pied de page du site -->
    <footer>
        <!-- Liens amenants aux contacts et mentions légales du site -->
        <ul>
            <li><a href="">Contact</a></li>
            <li><a href="">Mentions Légales</a></li>
        </ul>
        <!-- Informations du copyright -->
        <p>&copy; 2024 PixelVerse Studio. Tous droits réservés.</p>
    </footer>

    <script src="contact.js"></script>

</body>

</html>
